<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JØXTV Social Overlay</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="social youtube">
        <img src="assets/youtube.svg">

        <div>
            <span class="name">YOUTUBE</span>
            <span class="count" id="youtubeCount">
                0
            </span>
        </div>
    </div>


    <div class="social twitch">
        <img src="assets/twitch.svg">

        <div>
            <span class="name">TWITCH</span>
            <span class="count" id="twitchCount">
                0
            </span>
        </div>
    </div>


    <div class="social tiktok">
        <img src="assets/tiktok.svg">

        <div>
            <span class="name">TIKTOK</span>
            <span class="count" id="tiktokCount">
                0
            </span>
        </div>
    </div>

</div>


<script src="script.js"></script>

</body>
</html>
