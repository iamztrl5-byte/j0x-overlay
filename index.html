<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JØXTV Social Overlay</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="overlay">

    <div class="card" id="card">

        <div class="platform">
            <span id="platformName" class="social-title">
                YOUTUBE
            </span>
        </div>

        <div class="content">

            <div class="profile">

                <!-- AVATAR -->
                <div class="avatar">
                    <img id="avatar" src="assets/logo.png" alt="Profile">
                </div>

                <div class="data">

                    <!-- USERNAME -->
                    <div class="name">
                        <span class="dot"></span>
                        <span id="username">JØXTV</span>
                    </div>

                    <!-- COUNTER -->
                    <div class="counter">
                        <span id="count">0</span>
                    </div>

                    <!-- LABEL -->
                    <div class="label">FOLLOWERS</div>

                    <!-- FOLLOW BUTTON -->
                    <button id="followBtn" class="follow-btn">
                        FOLLOW
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
