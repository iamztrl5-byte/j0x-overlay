<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JØXTV Social Overlay</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="overlay">

    <div class="card" id="card">

        <div class="platform">
            <img id="socialIcon" src="assets/youtube.svg">
            <span id="platformName">YOUTUBE</span>
        </div>


        <div class="content">

            <div class="profile">

                <div class="avatar">
                    <img id="avatar" src="assets/logo.png">
                </div>

                <div class="data">

                    <div class="name">

                        <span class="dot"></span>

                        <span id="username">
                            JØXTV
                        </span>

                    </div>


                    <div class="counter">

                        <span id="count">
                            0
                        </span>

                    </div>


                    <div class="label">
                        FOLLOWERS
                    </div>

                </div>

            </div>


        </div>


    </div>


</div>


<script src="script.js"></script>

</body>

</html>
