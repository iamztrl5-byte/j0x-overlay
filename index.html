<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JØXTV Social Overlay</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="overlay">

  <div class="card" id="card">

    <div class="title" id="title">YOUTUBE</div>

    <div class="row">
      <img class="pfp" id="pfp" src="assets/youtube.svg" alt="Profile">

      <div class="data">
        <div class="name">
          <span class="dot"></span>
          <span id="name">J0X TV</span>
        </div>
        <div class="count" id="count">26,200</div>
      </div>
    </div>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
